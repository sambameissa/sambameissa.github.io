<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page introuvable</title>
    <script>
      // GitHub Pages ne connaît pas les routes des applications d'une seule page :
      // toute adresse inconnue arrive ici. Celles des applis (XamSQL, Iqra, XamPy) sont renvoyées vers
      // l'appli, qui restaure l'adresse demandée (voir src/main.tsx de chaque appli).
      (function () {
        var apps = ["/xamsql", "/iqra", "/xampy"];
        var p = location.pathname;
        for (var i = 0; i < apps.length; i++) {
          var base = apps[i];
          if (p === base || p.indexOf(base + "/") === 0) {
            var route = p.slice(base.length) || "/";
            location.replace(base + "/?__route=" + encodeURIComponent(route + location.search) + location.hash);
            return;
          }
        }
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f2f4f7; color: #13202d; }
      main { text-align: center; padding: 24px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      a { color: #10243a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cette page n'existe pas.</h1>
      <p><a href="/">Revenir à l'accueil</a></p>
    </main>
  </body>
</html>
